serenity {
  project.name = "OpenCart - compra E2E como invitado"
  take.screenshots = FOR_FAILURES
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
  }
}

headless.mode = false
chrome.switches = ["--window-size=1440,1000", "--disable-dev-shm-usage"]

webdriver.base.url = "http://opencart.abstracta.us"
